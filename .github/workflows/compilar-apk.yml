            "app/src/main/res/xml/backup_rules.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?><!--\n   Sample backup rules file; uncomment and customize as necessary.\n   See https://developer.android.com/guide/topics/data/autobackup\n   for details.\n   Note: This file is ignored for devices older than API 31\n   See https://developer.android.com/about/versions/12/backup-restore\n-->\n<full-backup-content>\n    <exclude domain=\"sharedpref\" path=\"keplerae_drive.xml\" />\n    <!--\n   <include domain=\"sharedpref\" path=\".\"/>\n   <exclude domain=\"sharedpref\" path=\"device.xml\"/>\n-->\n</full-backup-content>\n",
            "app/src/main/res/xml/data_extraction_rules.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?><!--\n   Sample data extraction rules file; uncomment and customize as necessary.\n   See https://developer.android.com/about/versions/12/backup-restore#xml-changes\n   for details.\n-->\n<data-extraction-rules>\n    <cloud-backup>\n        <exclude domain=\"sharedpref\" path=\"keplerae_drive.xml\" />\n        <!-- TODO: Use <include> and <exclude> to control what is backed up.\n        <include .../>\n        <exclude .../>\n        -->\n    </cloud-backup>\n    <device-transfer>\n        <exclude domain=\"sharedpref\" path=\"keplerae_drive.xml\" />\n    </device-transfer>\n</data-extraction-rules>\n",
            "app/src/test/java/com/example/DriveRequestsTest.kt": "package com.example\n\nimport com.example.data.drive.*\nimport org.junit.Assert.*\nimport org.junit.Test\nimport java.net.URLDecoder\n\nclass DriveRequestsTest {\n    @Test fun mediaUsesApiAndCredentialsStayOutOfUrl() {\n        val url = DriveRequests.file(\"real-ID_1\", true)\n        assertTrue(url.startsWith(\"https://www.googleapis.com/drive/v3/files/real-ID_1?\"))\n        assertTrue(url.contains(\"alt=media\"))\n        val headers = DriveCredentials(\"test-key\").headers(\"app\", \"cert\", \"real-ID_1\", \"resource-key\")\n        assertEquals(\"test-key\", headers[\"X-Goog-Api-Key\"])\n        assertEquals(\"real-ID_1/resource-key\", headers[\"X-Goog-Drive-Resource-Keys\"])\n        assertFalse(url.contains(\"test-key\"))\n    }\n    @Test fun googleAuthorizationReplacesAnonymousKey() {\n        val headers = DriveCredentials(\"key\", \"token\").headers(\"app\", \"cert\", \"id\", \"\")\n        assertEquals(\"Bearer token\", headers[\"Authorization\"])\n        assertFalse(headers.containsKey(\"X-Goog-Api-Key\"))\n        assertFalse(headers.containsKey(\"X-Goog-Drive-Resource-Keys\"))\n    }\n    @Test fun folderQueriesPreserveRealIdsAndPagination() {\n        val url = URLDecoder.decode(DriveRequests.folder(\"folder_ID\", \"next+token\"), \"UTF-8\")\n        assertTrue(url.contains(\"'folder_ID' in parents and trashed = false\"))\n        assertTrue(url.contains(\"pageToken=next+token\"))\n        assertEquals(\"abc-def_1\", DriveRequests.folderId(\"https://drive.google.com/drive/folders/abc-def_1?usp=sharing\"))\n        assertEquals(\"0-real_key\", DriveRequests.resourceKey(\"https://drive.google.com/file/d/id/view?usp=sharing&resourcekey=0-real_key\"))\n    }\n    @Test fun permissionsAndQuotaHaveDifferentRecoveryInstructions() {\n        assertEquals(\"downloadQuotaExceeded\", DriveRequests.errorReason(\"{\\\"error\\\":{\\\"errors\\\":[{\\\"reason\\\":\\\"downloadQuotaExceeded\\\"}]}}\"))\n        assertTrue(DriveRequests.errorMessage(404, \"notFound\").contains(\"autorize\"))\n        assertTrue(DriveRequests.errorMessage(403, \"downloadQuotaExceeded\").contains(\"limite\"))\n        assertTrue(DriveRequests.errorMessage(401, \"authError\").contains(\"expirou\"))\n        assertTrue(DriveRequests.errorMessage(403, \"fileNotDownloadable\").contains(\"proprietário\"))\n        assertTrue(DriveRequests.errorMessage(403, \"accessNotConfigured\").contains(\"Ative\"))\n    }\n    @Test(expected = IllegalArgumentException::class) fun rejectInjectedFileIds() {\n        DriveRequests.file(\"id?key=untrusted\")\n    }\n}\n",
            "app/src/androidTest/java/com/example/DriveNativeTest.kt": "package com.example\n\nimport android.graphics.Bitmap\nimport android.graphics.Color\nimport android.graphics.pdf.PdfDocument\nimport android.graphics.pdf.PdfRenderer\nimport android.os.ParcelFileDescriptor\nimport androidx.test.ext.junit.runners.AndroidJUnit4\nimport androidx.test.platform.app.InstrumentationRegistry\nimport com.example.data.drive.DriveSettings\nimport org.junit.Assert.*\nimport org.junit.Test\nimport org.junit.runner.RunWith\nimport java.io.File\nimport java.util.UUID\n\n@RunWith(AndroidJUnit4::class)\nclass DriveNativeTest {\n    @Test fun installedAppHasNetworkPermissionAndCanCreateSocket() {\n        val context = InstrumentationRegistry.getInstrumentation().targetContext\n        assertEquals(android.content.pm.PackageManager.PERMISSION_GRANTED,\n            context.checkPermission(android.Manifest.permission.INTERNET, android.os.Process.myPid(), android.os.Process.myUid()))\n        java.net.ServerSocket(0, 1, java.net.InetAddress.getLoopbackAddress()).use { server ->\n            java.net.Socket().use { client ->\n                client.connect(java.net.InetSocketAddress(java.net.InetAddress.getLoopbackAddress(), server.localPort), 2000)\n                server.accept().use { peer -> assertTrue(peer.isConnected) }\n            }\n        }\n    }\n    @Test fun pdfCanBeRenderedOnDeviceWithoutBrowser() {\n        val context = InstrumentationRegistry.getInstrumentation().targetContext\n        val file = File.createTempFile(\"native-pdf-test-\", \".pdf\", context.cacheDir)\n        try {\n            val document = PdfDocument()\n            try {\n                repeat(2) { index ->\n                    val page = document.startPage(PdfDocument.PageInfo.Builder(300, 400, index + 1).create())\n                    page.canvas.drawColor(if (index == 0) Color.RED else Color.BLUE)\n                    document.finishPage(page)\n                }\n                file.outputStream().use(document::writeTo)\n            } finally { document.close() }\n            ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY).use { descriptor ->\n                PdfRenderer(descriptor).use { renderer ->\n                    assertEquals(2, renderer.pageCount)\n                    renderer.openPage(1).use { page ->\n                        val bitmap = Bitmap.createBitmap(300, 400, Bitmap.Config.ARGB_8888)\n                        page.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)\n                        assertEquals(Color.BLUE, bitmap.getPixel(150, 200))\n                        bitmap.recycle()\n                    }\n                }\n            }\n        } finally { file.delete() }\n    }\n    @Test fun keyRoundTripsThroughKeystoreWithoutPlaintextPreference() {\n        val context = InstrumentationRegistry.getInstrumentation().targetContext\n        val name = \"drive-test-${UUID.randomUUID()}\"\n        val preferences = context.getSharedPreferences(name, 0)\n        val settings = DriveSettings(context, name)\n        try {\n            val key = \"not-a-real-api-key-for-local-keystore-test\"\n            settings.saveApiKey(key)\n            assertEquals(key, settings.apiKey())\n            assertFalse(preferences.getString(\"api_key\", \"\")!!.contains(key))\n            settings.saveApiKey(\"\")\n            assertEquals(\"\", settings.apiKey())\n        } finally { preferences.edit().clear().commit() }\n    }\n}\n",
            "README.md": "# Kepleræ 1.2.0 — materiais dentro do app\n\nAplicativo Android em Kotlin, Compose e Material 3. Temas Sistema, Claro e Escuro, cores dinâmicas, navegação adaptada a tablets, catálogo estático de 1.022 materiais, favoritos e progresso local.\n\n## Reprodução interna\n\nVídeos e áudios usam Media3/ExoPlayer dentro da tela do Kepleræ. Controles de reprodução, avanço/retrocesso de 10 segundos, velocidade e tela cheia. A posição é salva no aparelho; ao trocar de app a reprodução pausa.\n\nPDFs são obtidos da API e renderizados com PdfRenderer dentro do app, com páginas anterior/próxima, zoom por gesto e ajuste de página. Uma página por vez é renderizada fora da thread da interface. A cópia temporária do PDF é removida ao fechar a tela.\n\nAs pastas são consultadas e paginadas pela API. Os arquivos encontrados abrem nos mesmos visualizadores internos. Os 342 registros de Português que só tinham um link de pasta preservam o nome esperado para localizar o arquivo real. Não se inventam IDs de arquivos.\n\nEsta versão não abre o Chrome, Custom Tabs nem o app Drive para reproduzir materiais. A autorização Google pode apresentar a tela de seleção de conta e consentimento do sistema.\n\n## Configurar sua chave de API\n\n1. Instale o APK após a compilação.\n2. Toque na paleta de aparência → Configurar Google Drive, ou abra um material → Configurar Drive.\n3. Cole sua chave de API, iniciada por AIza, e toque em Salvar chave.\n4. Abra uma aula, áudio ou PDF público. A Google Drive API deve estar ativada no projeto da chave.\n\nA chave é criptografada com AES-GCM e Android Keystore no aparelho. Não está no APK, no catálogo ou no GitHub. Sua preferência criptografada fica excluída dos backups e transferências. A chave vai no cabeçalho X-Goog-Api-Key, sem aparecer nas URLs dos arquivos.\n\nSe usar restrições de aplicativo Android, configure o pacote com.aistudio.keplerae.stdy e o SHA-1 mostrado pelo APK em Configurar Drive. Restrinja a chave à Google Drive API. Uma chave configurada apenas para sites/referrers não atende às requisições nativas deste APK.\n\n## Arquivos privados\n\nChave de API não dá acesso aos arquivos privados da sua conta. O botão Autorizar conta Google usa Google Identity Services e solicita apenas leitura (drive.readonly).\n\nNo projeto Google Cloud, cadastre um cliente OAuth Android com o pacote com.aistudio.keplerae.stdy e o SHA-1 da versão instalada, que aparece em Configurar Drive. Configure o consentimento OAuth e, se o projeto estiver em teste, adicione a sua conta aos usuários de teste. Depois autorize a conta que tem acesso aos materiais no app.\n\nNão se deve inserir um client secret ou uma chave de conta de serviço no app. O token de acesso Google fica apenas em memória. Se expirar, autorize novamente. A chave de API pode ser usada sem OAuth para arquivos públicos.\n\nO acesso respeita as permissões, recursos de compartilhamento, limites de cota e bloqueios de download definidos pelo Drive. A API fornece os bytes dos arquivos; ela não fornece o player da página do Drive como um SDK Android. O Kepleræ oferece o seu próprio player nativo.\n\n## Compilar no GitHub\n\nSubstitua .github/workflows/compilar-apk.yml pelo arquivo completo fornecido nesta entrega. Ele utiliza o ZIP já publicado na raiz do repositório e aplica os arquivos da versão 1.2.0 antes de compilar.\n\nO workflow instala Java 17, Gradle 8.13 e SDK 36; valida o catálogo; executa testes unitários e lint; compila também os testes Android e gera Keplerae-1.2.0-debug.apk no artefato Keplerae-APK. O teste de interface/dispositivo é opcional pelo input testar_interface na execução manual.\n\nA assinatura de teste passa a usar o arquivo explícito .signing/debug.keystore, preservado pelo cache do Actions. Se não houver uma chave no cache, o runner gera uma nova. O primeiro APK 1.2.0 pode exigir remover a instalação antiga se sua assinatura diferir. Remover o app apaga favoritos, progresso e configuração local. Para atualizações permanentes de distribuição, configure uma chave de assinatura própria em um segredo do repositório.\n\n## Validação\n\nO catálogo e os XMLs foram validados localmente; a aplicação das alterações foi conferida contra o ZIP original. Foram adicionados testes unitários para URLs da API, credenciais nos cabeçalhos, resource keys, paginação, rejeição de IDs inválidos e mensagens de permissões/cotas. Foram adicionados testes Android para renderização de PDF e proteção da chave pelo Keystore.\n\nA versão 1.1.1 anterior compilou e passou em testes/lint. A versão 1.2.0 desta entrega ainda precisa de compilação no GitHub e teste com a sua chave e seus materiais. O ambiente local não tem Android SDK ou Gradle para compilá-la. A integração GitHub recusou gravações com erro 403 nas tentativas anteriores; a publicação manual do workflow resolve essa etapa.\n\nFigma do projeto: https://www.figma.com/design/pQWmh3JrwAj83TcxTWGATW\nRepositório: https://github.com/flubdugnton-rgb/Keplermadox\n",
            "verification.json": "{\n  \"version\": \"1.2.0\",\n  \"catalog\": \"passed\",\n  \"android_xml\": \"passed\",\n  \"workflow_patch_application\": \"passed\",\n  \"external_material_navigation\": \"removed\",\n  \"kotlin_unit_tests\": \"included_pending_execution\",\n  \"android_device_tests\": \"included_pending_execution\",\n  \"kotlin_compile\": \"pending_github_actions\",\n  \"android_lint\": \"pending_github_actions\",\n  \"live_drive_playback\": \"pending_user_api_configuration_and_device_test\",\n  \"apk\": \"pending_github_actions\"\n}\n"
          }''')
          for name, content in updates.items():
              target = Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          print('Keplerae 1.2.0 aplicado: player nativo, PDF nativo e API Drive.')
          PYNATIVE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preservar assinatura de teste
        uses: actions/cache@v4
        with:
          path: android-project/.signing/debug.keystore
          key: keplerae-native-debug-signing-v1
      - name: Preparar assinatura de teste explícita
        run: |
          mkdir -p .signing
          if [ ! -s .signing/debug.keystore ]; then
            keytool -genkeypair -noprompt -storetype JKS -keystore .signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Keplerae Debug,O=Keplerae,C=BR'
          fi
      - name: Validar catálogo
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/validate_network_permissions.py
      - name: Compilar, testar e verificar Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest :app:assembleDebug
      - name: Conferir permissões no APK final
        run: python3 scripts/validate_network_permissions.py app/build/outputs/apk/debug/app-debug.apk
      - name: Nomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Keplerae-1.2.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Keplerae-APK
          path: android-project/Keplerae-1.2.2-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Resultados das verificações
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-verificacoes
          path: |
            android-project/app/build/reports/tests/
            android-project/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  interface:
    if: github.event_name == 'workflow_dispatch' && inputs.testar_interface
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android-project
    steps:
      - uses: actions/checkout@v4
      - name: Extrair o projeto
        working-directory: .
        run: unzip -q keplerae-material-you.zip -d android-project
      - name: Aplicar reprodução interna 1.2.2
        run: |
