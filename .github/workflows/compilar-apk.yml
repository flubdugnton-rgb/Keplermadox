name: Compilar Keplerae 2.6 - Release
on:
  push:
    branches: [main, master]
    paths: ['Keplerae-2.6.zip', '.github/workflows/compilar-apk.yml']
  workflow_dispatch:
    inputs:
      testar_interface:
        description: Testar interface e abertura do APK release no emulador
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: apk-zip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-project
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto 2.6
        working-directory: .
        run: |
          test -f Keplerae-2.6.zip
          unzip -q Keplerae-2.6.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Configurar entrada Google
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: python3 scripts/configure_google_login.py
      - name: Preparar sons públicos do Pomodoro
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update; sudo apt-get install -y ffmpeg; }
          python3 scripts/fetch_pomodoro_sounds.py
          python3 scripts/fetch_ambient_sounds.py
      - name: Validar projeto
        run: |
          python3 scripts/validate_catalog.py
          python3 scripts/validate_network_permissions.py
          python3 scripts/validate_v26.py
          python3 scripts/validate_ambient_sounds.py
      # Valida o código público antes de restaurar a chave privada no runner.
      - name: Restaurar assinatura
        env:
          KEYSTORE_B64: ${{ secrets.KEPLERAE_KEYSTORE_B64 }}
        run: python3 scripts/restore_signing.py
      - name: Conferir a assinatura existente
        run: python3 scripts/verify_signing.py
      - name: Compilar release otimizado, testar e verificar
        run: gradle --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Validar APK e nomear
        run: |
          python3 scripts/validate_network_permissions.py app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk Keplerae-2.6.0-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Keplerae-2.6-APK
          path: android-project/Keplerae-2.6.0-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Resultados e mapa R8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Keplerae-2.6-verificacoes
          path: |
            android-project/app/build/reports/tests/
            android-project/app/build/reports/lint-results-release.html
            android-project/app/build/outputs/mapping/release/
          if-no-files-found: ignore
  interface:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.testar_interface }}
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: unzip -q Keplerae-2.6.zip -d android-project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restaurar assinatura
        working-directory: android-project
        env:
          KEYSTORE_B64: ${{ secrets.KEPLERAE_KEYSTORE_B64 }}
        run: python3 scripts/restore_signing.py
      - name: Conferir a assinatura existente
        working-directory: android-project
        run: python3 scripts/verify_signing.py
      - name: Configurar Google
        working-directory: android-project
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: python3 scripts/configure_google_login.py
      - uses: actions/download-artifact@v4
        with:
          name: Keplerae-2.6-APK
          path: release-apk
      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            python3 android-project/scripts/smoke_release.py release-apk/Keplerae-2.6.0-release.apk
            gradle --no-daemon -p android-project :app:connectedDebugAndroidTest
            mkdir -p android-project/app/build/design-preview
            adb pull /sdcard/Android/data/com.aistudio.keplerae.stdy/files/design-preview/. android-project/app/build/design-preview/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Keplerae-2.6-testes-dispositivo
          path: |
            android-project/app/build/reports/androidTests/
            android-project/app/build/design-preview/
          if-no-files-found: ignore
