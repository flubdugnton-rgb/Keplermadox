          updates = json.loads(r'''{
            "scripts/validate_network_permissions.py": "import os\nimport re\nimport subprocess\nimport sys\nfrom pathlib import Path\nfrom xml.etree import ElementTree\n\nREQUIRED = {\"android.permission.INTERNET\", \"android.permission.ACCESS_NETWORK_STATE\"}\nANDROID_NAME = \"{http://schemas.android.com/apk/res/android}name\"\n\n\ndef validate(permissions):\n    missing = REQUIRED - set(permissions)\n    if missing:\n        raise ValueError(\"Permissões de rede ausentes: \" + \", \".join(sorted(missing)))\n\n\nif __name__ == \"__main__\":\n    if len(sys.argv) == 2:\n        sdk = os.environ.get(\"ANDROID_HOME\") or os.environ.get(\"ANDROID_SDK_ROOT\")\n        if not sdk:\n            raise RuntimeError(\"SDK Android não encontrado\")\n        aapt = Path(sdk) / \"build-tools\" / \"36.0.0\" / \"aapt\"\n        output = subprocess.check_output([str(aapt), \"dump\", \"permissions\", sys.argv[1]], text=True)\n        validate(re.findall(r\"uses-permission: name='([^']+)'\", output))\n        print(\"APK final: permissões de internet e estado da rede presentes.\")\n    else:\n        manifest = ElementTree.parse(\"app/src/main/AndroidManifest.xml\").getroot()\n        validate(node.get(ANDROID_NAME) for node in manifest.findall(\"uses-permission\"))\n        print(\"Manifesto: permissões de rede corretas.\")\n",
            "app/build.gradle.kts": "plugins {\n    id(\"com.android.application\")\n    id(\"org.jetbrains.kotlin.android\")\n    id(\"org.jetbrains.kotlin.plugin.compose\")\n}\nandroid {\n    namespace = \"com.example\"\n    compileSdk = 36\n    defaultConfig {\n        applicationId = \"com.aistudio.keplerae.stdy\"\n        minSdk = 24\n        targetSdk = 36\n        versionCode = 6\n        versionName = \"1.2.2\"\n        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\n    }\n    buildTypes {\n        release { isMinifyEnabled = false }\n    }\n    signingConfigs {\n        getByName(\"debug\") {\n            val cachedKey = rootProject.file(\".signing/debug.keystore\")\n            if (cachedKey.exists()) {\n                storeFile = cachedKey\n                storePassword = \"android\"\n                keyAlias = \"androiddebugkey\"\n                keyPassword = \"android\"\n            }\n        }\n    }\n    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }\n    buildFeatures { compose = true }\n}\nkotlin { jvmToolchain(17) }\ndependencies {\n    implementation(\"androidx.appcompat:appcompat:1.7.1\")\n    implementation(\"androidx.media3:media3-exoplayer:1.8.1\")\n    implementation(\"androidx.media3:media3-ui:1.8.1\")\n    implementation(\"com.google.android.gms:play-services-auth:22.0.0\")\n    val composeVersion = \"1.9.1\"\n    implementation(\"androidx.core:core-ktx:1.16.0\")\n    implementation(\"androidx.activity:activity-compose:1.10.1\")\n    implementation(\"androidx.lifecycle:lifecycle-runtime-compose:2.9.4\")\n    implementation(\"androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4\")\n    implementation(\"androidx.compose.runtime:runtime:$composeVersion\")\n    implementation(\"androidx.compose.foundation:foundation:$composeVersion\")\n    implementation(\"androidx.compose.ui:ui:$composeVersion\")\n    implementation(\"androidx.compose.ui:ui-tooling-preview:$composeVersion\")\n    implementation(\"androidx.compose.material3:material3:1.4.0\")\n    implementation(\"androidx.compose.material:material-icons-extended:1.7.8\")\n    implementation(\"org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2\")\n    testImplementation(\"junit:junit:4.13.2\")\n    androidTestImplementation(\"androidx.test.ext:junit:1.2.1\")\n    androidTestImplementation(\"androidx.test:runner:1.6.2\")\n    androidTestImplementation(\"androidx.compose.ui:ui-test-junit4:$composeVersion\")\n    debugImplementation(\"androidx.compose.ui:ui-tooling:$composeVersion\")\n    debugImplementation(\"androidx.compose.ui:ui-test-manifest:$composeVersion\")\n}\n",
            "app/src/main/AndroidManifest.xml": "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\">\n\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n\n\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"@xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.MyApplication\">\n        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"true\"\n            android:label=\"@string/app_name\"\n            android:theme=\"@style/Theme.MyApplication\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n\n</manifest>\n",
            "app/src/main/java/com/example/ui/KepleraeApp.kt": "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\npackage com.example.ui\n\nimport android.os.Build\nimport androidx.activity.compose.BackHandler\nimport androidx.compose.animation.AnimatedContent\nimport androidx.compose.animation.core.animateFloatAsState\nimport androidx.compose.animation.fadeIn\nimport androidx.compose.animation.fadeOut\nimport androidx.compose.animation.togetherWith\nimport androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.interaction.MutableInteractionSource\nimport androidx.compose.foundation.interaction.collectIsPressedAsState\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.foundation.lazy.rememberLazyListState\nimport androidx.compose.foundation.shape.CircleShape\nimport androidx.compose.foundation.shape.RoundedCornerShape\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.automirrored.filled.ArrowBack\nimport androidx.compose.material.icons.automirrored.filled.ArrowForward\nimport androidx.compose.material.icons.automirrored.filled.LibraryBooks\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material.icons.outlined.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.geometry.Offset\nimport androidx.compose.ui.geometry.Size\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.drawscope.rotate\nimport androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.graphics.lerp\nimport androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.platform.testTag\nimport androidx.compose.ui.res.painterResource\nimport androidx.compose.ui.text.font.FontWeight\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport com.example.R\nimport com.example.data.model.*\nimport com.example.data.repository.*\nimport com.example.ui.theme.isDarkMode\n\nenum class Destination(val title: String, val icon: ImageVector, val type: ContentType?) {\n    HOME(\"Início\", Icons.Outlined.Home, null),\n    VIDEOS(\"Aulas\", Icons.Outlined.PlayCircleOutline, ContentType.VIDEO),\n    PDFS(\"PDFs\", Icons.AutoMirrored.Filled.LibraryBooks, ContentType.PDF),\n    AUDIO(\"Áudios\", Icons.Outlined.Headphones, ContentType.AUDIO),\n    SUBJECTS(\"Matérias\", Icons.Outlined.GridView, null)\n}\n\n@Composable fun KepleraeApp(state: StudyState, model: StudyViewModel) {\n    var destinationName by rememberSaveable { mutableStateOf(Destination.HOME.name) }\n    var subjectId by rememberSaveable { mutableStateOf<String?>(null) }\n    var pathKey by rememberSaveable { mutableStateOf(\"\") }\n    var settings by rememberSaveable { mutableStateOf(false) }\n    var activeId by rememberSaveable { mutableStateOf<String?>(null) }\n    val destination = Destination.valueOf(destinationName)\n    val subject = subjectId?.let { Subjects.get(it) }\n    val path = if (pathKey.isBlank()) emptyList() else pathKey.split('\\u001f')\n    val activeItem = state.items.firstOrNull { it.id == activeId }\n    fun navigate(next: Destination) { destinationName = next.name; subjectId = null; pathKey = \"\" }\n    fun select(next: Subject) { subjectId = next.id; pathKey = \"\" }\n    fun open(item: StudyItem) {\n        model.recordAccess(item.id)\n        activeId = item.id\n    }\n    fun back() { if (path.isNotEmpty()) pathKey = path.dropLast(1).joinToString(\"\\u001f\") else subjectId = null }\n    BackHandler(enabled = subject != null && activeItem == null && !settings) { back() }\n    BoxWithConstraints(Modifier.fillMaxSize()) {\n        val expanded = maxWidth >= 700.dp\n        Scaffold(\n            topBar = {\n                TopAppBar(title = {\n                    Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {\n                        if (subject == null) {\n                            Surface(color = MaterialTheme.colorScheme.primaryContainer, shape = RoundedCornerShape(16.dp)) {\n                                Icon(painterResource(R.drawable.ic_kepler_symbol), null,\n                                    Modifier.padding(10.dp).size(24.dp), tint = MaterialTheme.colorScheme.onPrimaryContainer)\n                            }\n                        }\n                        Text(subject?.name ?: \"Kepleræ\", style = MaterialTheme.typography.titleLarge,\n                            maxLines = 1, overflow = TextOverflow.Ellipsis)\n                    }\n                }, navigationIcon = {\n                    if (subject != null) IconButton(onClick = ::back) { Icon(Icons.AutoMirrored.Filled.ArrowBack, \"Voltar\") }\n                }, actions = {\n                    IconButton(onClick = { settings = true }, modifier = Modifier.testTag(\"settings\")) {\n                        Icon(Icons.Outlined.Palette, \"Aparência\")\n                    }\n                }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.surface))\n            },\n            bottomBar = {\n                if (!expanded) NavigationBar(containerColor = MaterialTheme.colorScheme.surfaceContainer) {\n                    Destination.entries.forEach { dest -> NavigationBarItem(\n                        selected = destination == dest,\n                        onClick = { navigate(dest) },\n                        icon = { Icon(dest.icon, null) },\n                        label = { Text(dest.title) }, modifier = Modifier.testTag(\"nav_${dest.name}\"))\n                    }\n                }\n            }, containerColor = MaterialTheme.colorScheme.surface\n        ) { padding ->\n            Row(Modifier.fillMaxSize().padding(padding)) {\n                if (expanded) NavigationRail(containerColor = MaterialTheme.colorScheme.surfaceContainerLow,\n                    modifier = Modifier.fillMaxHeight()) {\n                    Spacer(Modifier.height(24.dp))\n                    Destination.entries.forEach { dest -> NavigationRailItem(selected = destination == dest,\n                        onClick = { navigate(dest) }, icon = { Icon(dest.icon, null) }, label = { Text(dest.title) }) }\n                }\n                Box(Modifier.weight(1f).fillMaxHeight(), contentAlignment = Alignment.TopCenter) {\n                    Box(Modifier.widthIn(max = 960.dp).fillMaxSize()) {\n                        when {\n                            state.loading -> CircularProgressIndicator(Modifier.align(Alignment.Center))\n                            state.error != null -> Column(Modifier.align(Alignment.Center).padding(24.dp),\n                                horizontalAlignment = Alignment.CenterHorizontally) {\n                                Text(state.error)\n                                Button(onClick = model::reload) { Text(\"Tentar novamente\") }\n                            }\n                            else -> AnimatedContent(targetState = subjectId to destination,\n                                transitionSpec = { fadeIn() togetherWith fadeOut() }, label = \"destinations\") { (selectedId, dest) ->\n                                if (selectedId == null && dest == Destination.HOME) {\n                                    Dashboard(state, ::navigate, ::select, ::open)\n                                } else {\n                                    Catalog(state, dest, selectedId?.let { Subjects.get(it) }, path,\n                                        onSelectSubject = ::select,\n                                        onFolder = { pathKey = (path + it).joinToString(\"\\u001f\") },\n                                        onOpen = ::open, onFavorite = model::toggleFavorite, onCompleted = model::toggleCompleted)\n                                }\n                            }\n                        }\n                    }\n                }\n            }\n        }\n    }\n    if (settings) AppearanceSheet(state, model, onDismiss = { settings = false })\n    if (activeItem != null) DriveViewer(activeItem, state, onDismiss = { activeId = null },\n        onFavorite = model::toggleFavorite, onCompleted = model::toggleCompleted, onAccess = model::recordAccess)\n}\n\n@Composable private fun Dashboard(state: StudyState, onNavigate: (Destination) -> Unit,\n    onSubject: (Subject) -> Unit, onOpen: (StudyItem) -> Unit) {\n    val recent = remember(state.items, state.accessed) {\n        state.items.filter { it.id in state.accessed }.sortedByDescending { state.accessed[it.id] }.take(4)\n    }\n    val complete = state.items.count { it.id in state.completed }\n    val progress = if (state.items.isEmpty()) 0f else complete.toFloat() / state.items.size\n    LazyColumn(contentPadding = PaddingValues(20.dp), verticalArrangement = Arrangement.spacedBy(20.dp)) {\n        item {\n            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                Column(Modifier.weight(1f)) {\n                    Text(\"SEU ESPAÇO DE ESTUDO\", style = MaterialTheme.typography.labelMedium,\n                        color = MaterialTheme.colorScheme.primary)\n                    Spacer(Modifier.height(6.dp))\n                    Text(\"Aprender,\\nno seu ritmo.\", style = MaterialTheme.typography.displayLarge)\n                }\n                OrbitShape(Modifier.size(92.dp))\n            }\n        }\n        item {\n            Card(shape = RoundedCornerShape(32.dp), colors = CardDefaults.cardColors(MaterialTheme.colorScheme.primaryContainer)) {\n                Column(Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Icon(Icons.Outlined.AutoAwesome, null, tint = MaterialTheme.colorScheme.onPrimaryContainer)\n                        Spacer(Modifier.width(10.dp))\n                        Text(\"Seu percurso\", style = MaterialTheme.typography.titleLarge,\n                            color = MaterialTheme.colorScheme.onPrimaryContainer)\n                    }\n                    Text(\"$complete de ${state.items.size} materiais concluídos\",\n                        color = MaterialTheme.colorScheme.onPrimaryContainer, style = MaterialTheme.typography.bodyLarge)\n                    LinearProgressIndicator(progress = { progress }, modifier = Modifier.fillMaxWidth().height(8.dp),\n                        color = MaterialTheme.colorScheme.primary, trackColor = MaterialTheme.colorScheme.surface.copy(alpha = .6f))\n                    Button(onClick = { if (recent.isEmpty()) onNavigate(Destination.SUBJECTS) else onOpen(recent.first()) },\n                        shape = RoundedCornerShape(24.dp)) {\n                        Icon(if (recent.isEmpty()) Icons.Outlined.GridView else Icons.Filled.PlayArrow, null)\n                        Spacer(Modifier.width(8.dp))\n                        Text(if (recent.isEmpty()) \"Escolher uma matéria\" else \"Retomar estudo\")\n                    }\n                }\n            }\n        }\n        item {\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {\n                listOf(Destination.VIDEOS, Destination.PDFS, Destination.AUDIO).forEachIndexed { index, dest ->\n                    Card(onClick = { onNavigate(dest) }, modifier = Modifier.weight(1f),\n                        shape = RoundedCornerShape(topStart = if (index == 0) 28.dp else 12.dp,\n                            topEnd = if (index == 2) 28.dp else 12.dp, bottomEnd = 28.dp, bottomStart = 28.dp),\n                        colors = CardDefaults.cardColors(MaterialTheme.colorScheme.surfaceContainerHigh)) {\n                        Column(Modifier.padding(14.dp).fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(6.dp)) {\n                            Icon(dest.icon, null, tint = MaterialTheme.colorScheme.primary)\n                            Text(state.items.count { it.type == dest.type }.toString(), style = MaterialTheme.typography.headlineSmall)\n                            Text(dest.title, style = MaterialTheme.typography.labelLarge)\n                        }\n                    }\n                }\n            }\n        }\n        item { SectionTitle(\"Suas matérias\", \"Ver todas\") { onNavigate(Destination.SUBJECTS) } }\n        items(Subjects.all.chunked(2)) { row ->\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                row.forEach { subject -> SubjectTile(subject, state, Modifier.weight(1f)) { onSubject(subject) } }\n                if (row.size == 1) Spacer(Modifier.weight(1f))\n            }\n        }\n        if (recent.isNotEmpty()) {\n            item { SectionTitle(\"Acessados recentemente\") }\n            items(recent, key = { \"recent_${it.id}\" }) { item ->\n                ListItem(headlineContent = { Text(item.title, maxLines = 2, overflow = TextOverflow.Ellipsis) },\n                    supportingContent = { Text(Subjects.get(item.subjectId).name) },\n                    leadingContent = { Icon(contentIcon(item.type), null) },\n                    trailingContent = { IconButton(onClick = { onOpen(item) }) { Icon(Icons.AutoMirrored.Filled.ArrowForward, \"Abrir\") } },\n                    colors = ListItemDefaults.colors(containerColor = MaterialTheme.colorScheme.surfaceContainerLow))\n            }\n        }\n    }\n}\n\n@Composable private fun SectionTitle(title: String, action: String? = null, onAction: () -> Unit = {}) {\n    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n        Text(title, style = MaterialTheme.typography.titleLarge, modifier = Modifier.weight(1f))\n        if (action != null) TextButton(onClick = onAction) { Text(action) }\n    }\n}\n\n@Composable private fun SubjectTile(subject: Subject, state: StudyState, modifier: Modifier, onClick: () -> Unit) {\n    val dark = isDarkMode(state.theme)\n    val palette = subjectPalette(subject.id, dark)\n    val interaction = remember { MutableInteractionSource() }\n    val pressed by interaction.collectIsPressedAsState()\n    val scale by animateFloatAsState(if (pressed) .96f else 1f, label = \"card_press\")\n    val index = Subjects.all.indexOf(subject)\n    val subjectItems = remember(state.items, subject.id) { state.items.filter { it.subjectId == subject.id } }\n    val count = subjectItems.size\n    val completed = subjectItems.count { it.id in state.completed }\n    Card(onClick = onClick, interactionSource = interaction,\n        modifier = modifier.graphicsLayer { scaleX = scale; scaleY = scale },\n        shape = RoundedCornerShape(topStart = 28.dp, topEnd = if (index % 2 == 0) 12.dp else 28.dp,\n            bottomEnd = 28.dp, bottomStart = if (index % 2 == 0) 28.dp else 12.dp),\n        colors = CardDefaults.cardColors(containerColor = palette.first, contentColor = palette.second)) {\n        Column(Modifier.padding(18.dp).fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(10.dp)) {\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween, verticalAlignment = Alignment.CenterVertically) {\n                Surface(shape = if (index % 2 == 0) RoundedCornerShape(14.dp) else CircleShape,\n                    color = palette.second.copy(alpha = .1f)) {\n                    Text(subject.monogram, Modifier.padding(12.dp), style = MaterialTheme.typography.titleMedium,\n                        color = palette.second)\n                }\n                Icon(Icons.AutoMirrored.Filled.ArrowForward, null, Modifier.size(18.dp))\n            }\n            Text(subject.name, style = MaterialTheme.typography.titleMedium, minLines = 2)\n            Text(\"$count materiais\", style = MaterialTheme.typography.bodyMedium)\n            LinearProgressIndicator(progress = { if (count == 0) 0f else completed.toFloat() / count },\n                modifier = Modifier.fillMaxWidth().height(4.dp), color = palette.second,\n                trackColor = palette.second.copy(alpha = .12f))\n        }\n    }\n}\n\n@Composable private fun Catalog(state: StudyState, destination: Destination, subject: Subject?, path: List<String>,\n    onSelectSubject: (Subject) -> Unit, onFolder: (String) -> Unit, onOpen: (StudyItem) -> Unit,\n    onFavorite: (String) -> Unit, onCompleted: (String) -> Unit) {\n    var query by rememberSaveable(destination, subject?.id) { mutableStateOf(\"\") }\n    var filter by rememberSaveable(destination, subject?.id) { mutableStateOf(\"all\") }\n    var typeName by rememberSaveable(destination, subject?.id) { mutableStateOf(\"\") }\n    val type = destination.type ?: typeName.takeIf { it.isNotBlank() }?.let { ContentType.valueOf(it) }\n    val base = remember(state.items, destination, subject, type) { state.items.filter {\n        (subject == null || it.subjectId == subject.id) && (type == null || it.type == type)\n    } }\n    val filtered = remember(base, state.favorites, state.completed, filter, query) { base.filter {\n        it.matches(query) && when (filter) {\n            \"favorites\" -> it.id in state.favorites\n            \"completed\" -> it.id in state.completed\n            \"pending\" -> it.id !in state.completed\n            else -> true\n        }\n    } }\n    val browsing = query.isBlank() && filter == \"all\"\n    val showSubjects = browsing && subject == null\n    val scoped = if (subject != null && browsing) itemsInPath(filtered, path) else filtered\n    val folders = if (subject != null && browsing) scoped.mapNotNull { it.folderPath.getOrNull(path.size) }.distinct() else emptyList()\n    val leaves = if (subject != null && browsing) scoped.filter { it.folderPath.size == path.size } else scoped\n    val listState = rememberLazyListState()\n    LaunchedEffect(path, query, filter, subject?.id, destination, typeName) { listState.scrollToItem(0) }\n    LazyColumn(state = listState, contentPadding = PaddingValues(20.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n        item {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                Text(path.lastOrNull() ?: subject?.name ?: destination.title, style = MaterialTheme.typography.headlineLarge)\n                Text(if (path.isNotEmpty()) path.joinToString(\" › \") else subject?.subtitle ?: when (destination) {\n                    Destination.PDFS -> \"Artigos do Profisio e materiais das suas matérias\"\n                    Destination.AUDIO -> \"Escute os áudios do Profisio\"\n                    Destination.VIDEOS -> \"Suas aulas, organizadas por matéria\"\n                    else -> \"Escolha uma pasta para começar\"\n                }, color = MaterialTheme.colorScheme.onSurfaceVariant, style = MaterialTheme.typography.bodyLarge)\n                Text(\"${scoped.size} materiais\", style = MaterialTheme.typography.labelLarge, color = MaterialTheme.colorScheme.primary)\n            }\n        }\n        item {\n            OutlinedTextField(value = query, onValueChange = { query = it }, singleLine = true,\n                modifier = Modifier.fillMaxWidth().testTag(\"catalog_search\"),\n                placeholder = { Text(\"Buscar aulas, arquivos e pastas\") },\n                leadingIcon = { Icon(Icons.Outlined.Search, null) },\n                trailingIcon = { if (query.isNotBlank()) IconButton(onClick = { query = \"\" }) { Icon(Icons.Filled.Close, \"Limpar busca\") } },\n                shape = RoundedCornerShape(28.dp))\n        }\n        item {\n            androidx.compose.foundation.lazy.LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                items(listOf(\"all\" to \"Todos\", \"favorites\" to \"Favoritos\", \"pending\" to \"Pendentes\", \"completed\" to \"Concluídos\")) { (id, label) ->\n                    FilterChip(selected = filter == id, onClick = { filter = id }, label = { Text(label) },\n                        leadingIcon = { if (filter == id) Icon(Icons.Filled.Check, null, Modifier.size(16.dp)) })\n                }\n            }\n        }\n        if (subject != null && destination.type == null) item {\n            androidx.compose.foundation.lazy.LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                item { FilterChip(selected = typeName.isBlank(), onClick = { typeName = \"\" }, label = { Text(\"Todos os formatos\") }) }\n                items(ContentType.entries) { t -> FilterChip(selected = typeName == t.name,\n                    onClick = { typeName = t.name }, label = { Text(t.label) }) }\n            }\n        }\n        if (showSubjects) {\n            items(Subjects.all.filter { s -> base.any { it.subjectId == s.id } }.chunked(2)) { row ->\n                Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                    row.forEach { s -> SubjectTile(s, state.copy(items = base), Modifier.weight(1f)) { onSelectSubject(s) } }\n                    if (row.size == 1) Spacer(Modifier.weight(1f))\n                }\n            }\n        } else {\n            items(folders, key = { \"folder_$it\" }) { name ->\n                val count = scoped.count { it.folderPath.getOrNull(path.size) == name }\n                Card(onClick = { onFolder(name) }, shape = RoundedCornerShape(24.dp),\n                    colors = CardDefaults.cardColors(MaterialTheme.colorScheme.surfaceContainerHigh)) {\n                    Row(Modifier.padding(16.dp).fillMaxWidth(), verticalAlignment = Alignment.CenterVertically,\n                        horizontalArrangement = Arrangement.spacedBy(14.dp)) {\n                        Surface(shape = RoundedCornerShape(16.dp), color = MaterialTheme.colorScheme.secondaryContainer) {\n                            Icon(Icons.Outlined.Folder, null, Modifier.padding(14.dp), tint = MaterialTheme.colorScheme.onSecondaryContainer)\n                        }\n                        Column(Modifier.weight(1f)) {\n                            Text(name, style = MaterialTheme.typography.titleMedium)\n                            Text(\"$count materiais\", style = MaterialTheme.typography.bodyMedium,\n                                color = MaterialTheme.colorScheme.onSurfaceVariant)\n                        }\n                        Icon(Icons.AutoMirrored.Filled.ArrowForward, null, Modifier.size(18.dp))\n                    }\n                }\n            }\n            items(leaves, key = { it.id }) { item ->\n                MaterialRow(item, state, onOpen, onFavorite, onCompleted)\n            }\n        }\n        if (scoped.isEmpty()) item {\n            Column(Modifier.fillMaxWidth().padding(32.dp), horizontalAlignment = Alignment.CenterHorizontally,\n                verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                Icon(Icons.Outlined.SearchOff, null, Modifier.size(40.dp), tint = MaterialTheme.colorScheme.primary)\n                Text(\"Nenhum material encontrado\", style = MaterialTheme.typography.titleMedium)\n                Text(\"Tente outro termo ou ajuste os filtros.\", color = MaterialTheme.colorScheme.onSurfaceVariant)\n            }\n        }\n    }\n}\n\n@Composable private fun MaterialRow(item: StudyItem, state: StudyState, onOpen: (StudyItem) -> Unit,\n    onFavorite: (String) -> Unit, onCompleted: (String) -> Unit) {\n    val complete = item.id in state.completed\n    Card(shape = RoundedCornerShape(24.dp), colors = CardDefaults.cardColors(MaterialTheme.colorScheme.surfaceContainerLow)) {\n        Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {\n            Row(verticalAlignment = Alignment.Top, horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                Surface(color = MaterialTheme.colorScheme.secondaryContainer, shape = RoundedCornerShape(16.dp)) {\n                    Icon(contentIcon(item.type), null, Modifier.padding(12.dp), tint = MaterialTheme.colorScheme.onSecondaryContainer)\n                }\n                Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {\n                    Text(item.title, style = MaterialTheme.typography.titleMedium)\n                    Text(item.filename, style = MaterialTheme.typography.bodySmall, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                    Text(if (complete) \"Concluído\" else \"${Subjects.get(item.subjectId).name} · ${item.type.label}\",\n                        style = MaterialTheme.typography.labelMedium, color = MaterialTheme.colorScheme.primary)\n                }\n                IconButton(onClick = { onFavorite(item.id) }) {\n                    Icon(if (item.id in state.favorites) Icons.Filled.Favorite else Icons.Outlined.FavoriteBorder,\n                        if (item.id in state.favorites) \"Remover dos favoritos\" else \"Favoritar\",\n                        tint = MaterialTheme.colorScheme.primary)\n                }\n            }\n            if (item.note.isNotBlank()) Text(item.note, style = MaterialTheme.typography.bodySmall,\n                color = MaterialTheme.colorScheme.onSurfaceVariant)\n            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.SpaceBetween) {\n                FilledTonalButton(onClick = { onOpen(item) }) {\n                    Icon(if (item.linkKind == LinkKind.FOLDER) Icons.Outlined.FolderOpen else contentIcon(item.type),\n                        null, Modifier.size(18.dp))\n                    Spacer(Modifier.width(8.dp))\n                    Text(if (item.linkKind == LinkKind.FOLDER) \"Abrir pasta\" else when (item.type) {\n                        ContentType.VIDEO -> \"Assistir\"\n                        ContentType.PDF -> \"Ler PDF\"\n                        ContentType.AUDIO -> \"Ouvir\"\n                    })\n                }\n                IconToggleButton(checked = complete, onCheckedChange = { onCompleted(item.id) }) {\n                    Icon(if (complete) Icons.Filled.CheckCircle else Icons.Outlined.CheckCircle,\n                        if (complete) \"Marcar como pendente\" else \"Marcar como concluído\")\n                }\n            }\n        }\n    }\n}\n\n@Composable private fun AppearanceSheet(state: StudyState, model: StudyViewModel, onDismiss: () -> Unit) {\n    var configureDrive by remember { mutableStateOf(false) }\n    ModalBottomSheet(onDismissRequest = onDismiss) {\n        Column(Modifier.fillMaxWidth().padding(horizontal = 24.dp).padding(bottom = 32.dp),\n            verticalArrangement = Arrangement.spacedBy(20.dp)) {\n            Text(\"Do seu jeito\", style = MaterialTheme.typography.headlineMedium)\n            Text(\"Aparência\", style = MaterialTheme.typography.titleMedium)\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                ThemeMode.entries.forEach { mode ->\n                    FilterChip(selected = mode == state.theme, onClick = { model.setTheme(mode) },\n                        modifier = Modifier.weight(1f).heightIn(min = 48.dp).testTag(\"theme_${mode.name}\"),\n                        label = { Text(mode.label) })\n                }\n            }\n            Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                Column(Modifier.weight(1f)) {\n                    Text(\"Cores do seu Android\", style = MaterialTheme.typography.titleMedium)\n                    Text(if (Build.VERSION.SDK_INT >= 31) \"Use as cores do seu papel de parede.\" else \"Disponível no Android 12 ou superior.\",\n                        style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)\n                }\n                Switch(checked = state.dynamicColor, onCheckedChange = model::setDynamicColor,\n                    enabled = Build.VERSION.SDK_INT >= 31)\n            }\n            HorizontalDivider()\n            OutlinedButton(onClick = { configureDrive = true }, modifier = Modifier.fillMaxWidth()) {\n                Text(\"Configurar Google Drive\")\n            }\n            Text(\"Kepleræ 1.2.2\", style = MaterialTheme.typography.titleMedium)\n            Text(\"${state.items.size} materiais. Favoritos, conclusões e tema são salvos neste dispositivo.\",\n                style = MaterialTheme.typography.bodyMedium, color = MaterialTheme.colorScheme.onSurfaceVariant)\n        }\n    }\n    if (configureDrive) DriveConfigDialog { configureDrive = false }\n}\n\nprivate fun contentIcon(type: ContentType): ImageVector = when (type) {\n    ContentType.VIDEO -> Icons.Outlined.PlayCircleOutline\n    ContentType.PDF -> Icons.Outlined.Description\n    ContentType.AUDIO -> Icons.Outlined.Headphones\n}\nprivate fun subjectPalette(id: String, dark: Boolean): Pair<Color, Color> {\n    val colors = when (id) {\n        \"fisioterapia\" -> listOf(0xFFD0F4E6,0xFF064F3C,0xFF173D33,0xFFAFF0D5)\n        \"portugues\" -> listOf(0xFFFFDFEB,0xFF70324C,0xFF4C2638,0xFFFFB2D0)\n        \"matematica\" -> listOf(0xFFDBE6FF,0xFF274777,0xFF23344F,0xFFB6CEFF)\n        \"hu_legislacao\" -> listOf(0xFFFFE8CA,0xFF654512,0xFF49351C,0xFFF5D49D)\n        \"sus\" -> listOf(0xFFE1EFC4,0xFF3C4E17,0xFF303D1B,0xFFD4E9AA)\n        else -> listOf(0xFFEBDFFF,0xFF533777,0xFF3D2C50,0xFFE0C3FF)\n    }\n    return if (dark) Color(colors[2]) to Color(colors[3]) else Color(colors[0]) to Color(colors[1])\n}\n@Composable private fun OrbitShape(modifier: Modifier) {\n    val primary = MaterialTheme.colorScheme.primaryContainer\n    val accent = MaterialTheme.colorScheme.primary\n    Canvas(modifier) {\n        rotate(15f) {\n            val half = size.width / 2f\n            listOf(Offset(0f,0f),Offset(half,0f),Offset(0f,half),Offset(half,half)).forEach {\n                drawCircle(primary, half * .67f, it + Offset(half / 2f, half / 2f))\n            }\n            drawCircle(accent, size.width * .12f, center)\n        }\n    }\n}\n",
            "app/src/main/java/com/example/ui/DriveViewer.kt": "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)\npackage com.example.ui\n\nimport androidx.compose.foundation.clickable\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.automirrored.filled.ArrowBack\nimport androidx.compose.material.icons.filled.*\nimport androidx.compose.material.icons.outlined.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.text.style.TextOverflow\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.window.Dialog\nimport androidx.compose.ui.window.DialogProperties\nimport com.example.data.drive.*\nimport com.example.data.model.*\nimport com.example.data.repository.StudyState\nimport kotlinx.coroutines.CancellationException\nimport java.io.File\n\nprivate data class MaterialLoad(val loading: Boolean = true, val file: DriveFile? = null,\n    val pdf: File? = null, val progress: Float? = null, val error: String? = null)\nprivate data class FolderLoad(val loading: Boolean = true, val files: List<DriveFile> = emptyList(),\n    val error: String? = null)\n\n@Composable fun DriveViewer(item: StudyItem, state: StudyState, onDismiss: () -> Unit,\n    onFavorite: (String) -> Unit, onCompleted: (String) -> Unit, onAccess: (String) -> Unit) {\n    val context = LocalContext.current\n    val revision = DriveSession.revision\n    val token = DriveSession.accessToken\n    val credentials = remember(revision, token) { DriveSettings(context).credentials() }\n    val repository = remember(credentials) { DriveRepository(context, credentials) }\n    var configure by remember { mutableStateOf(false) }\n    var fullscreen by remember(item.id) { mutableStateOf(false) }\n    var selected by remember(item.id) { mutableStateOf(if (item.linkKind == LinkKind.FILE) item else null) }\n    val initialFolder = remember(item.id) {\n        DriveFile(DriveRequests.folderId(item.url), item.title, \"application/vnd.google-apps.folder\", DriveRequests.resourceKey(item.url))\n    }\n    var folders by remember(item.id) { mutableStateOf(listOf(initialFolder)) }\n    val active = selected ?: item\n    fun back() {\n        when {\n            fullscreen -> fullscreen = false\n            selected != null && item.linkKind == LinkKind.FOLDER -> selected = null\n            selected == null && folders.size > 1 -> folders = folders.dropLast(1)\n            else -> onDismiss()\n        }\n    }\n    Dialog(onDismissRequest = ::back,\n        properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)) {\n        Surface(Modifier.fillMaxSize()) {\n            Scaffold(\n                topBar = {\n                    if (!fullscreen) TopAppBar(\n                        title = { Text(if (selected != null) active.title else folders.last().name,\n                            maxLines = 1, overflow = TextOverflow.Ellipsis) },\n                        navigationIcon = { IconButton(onClick = ::back) {\n                            Icon(Icons.AutoMirrored.Filled.ArrowBack, \"Voltar\")\n                        } },\n                        actions = {\n                            IconButton(onClick = { configure = true }) { Icon(Icons.Outlined.Settings, \"Configurar Drive\") }\n                            if (selected != null) {\n                                IconButton(onClick = { onFavorite(active.id) }) {\n                                    Icon(if (active.id in state.favorites) Icons.Filled.Favorite else Icons.Outlined.FavoriteBorder, \"Favoritar\")\n                                }\n                                IconButton(onClick = { fullscreen = true }) { Icon(Icons.Outlined.Fullscreen, \"Tela cheia\") }\n                            }\n                        })\n                },\n                bottomBar = {\n                    if (!fullscreen && selected != null) Surface(color = MaterialTheme.colorScheme.surfaceContainer) {\n                        Column(Modifier.fillMaxWidth().navigationBarsPadding().padding(16.dp),\n                            verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                            if (active.note.isNotBlank()) Text(active.note, style = MaterialTheme.typography.bodySmall)\n                            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp),\n                                verticalAlignment = Alignment.CenterVertically) {\n                                Column(Modifier.weight(1f)) {\n                                    Text(active.type.label, style = MaterialTheme.typography.labelLarge)\n                                    Text(\"Seu progresso fica salvo no Kepleræ.\", style = MaterialTheme.typography.bodySmall)\n                                }\n                                Button(onClick = { onCompleted(active.id) }) {\n                                    Text(if (active.id in state.completed) \"Concluído ✓\" else \"Concluir\")\n                                }\n                            }\n                        }\n                    }\n                }\n            ) { padding ->\n                Box(Modifier.fillMaxSize().padding(padding)) {\n                    when {\n                        !credentials.configured -> ViewerMessage(\"Conecte seu Google Drive\",\n                            \"Adicione sua chave de API para materiais públicos ou autorize a conta Google para arquivos privados.\",\n                            onConfigure = { configure = true })\n                        selected != null -> MaterialContent(active, repository, Modifier.fillMaxSize()) { configure = true }\n                        else -> FolderContent(folders.last(), item, repository,\n                            onFolder = { folders = folders + it },\n                            onFile = { file -> selected = file.studyItem(item); onAccess(selected!!.id) },\n                            onConfigure = { configure = true })\n                    }\n                    if (fullscreen) FilledIconButton(onClick = { fullscreen = false },\n                        modifier = Modifier.align(Alignment.TopEnd).statusBarsPadding().padding(12.dp)) {\n                        Icon(Icons.Outlined.FullscreenExit, \"Sair da tela cheia\")\n                    }\n                }\n            }\n        }\n    }\n    if (configure) DriveConfigDialog { configure = false }\n}\n\n@Composable private fun MaterialContent(item: StudyItem, repository: DriveRepository,\n    modifier: Modifier, onConfigure: () -> Unit) {\n    val context = LocalContext.current\n    var retry by remember(item.id) { mutableIntStateOf(0) }\n    val loaded by produceState(MaterialLoad(), item.id, repository, retry) {\n        value = MaterialLoad()\n        var temporary: File? = null\n        try {\n            val file = repository.metadata(item.driveFileId, DriveRequests.resourceKey(item.url))\n            require(file.canDownload) { \"O proprietário bloqueou a leitura do conteúdo pela API. A chave não altera essa permissão.\" }\n            require(file.contentType != null) { \"Este formato não é suportado pelo visualizador interno.\" }\n            if (file.contentType == ContentType.PDF) {\n                temporary = File.createTempFile(\"drive-pdf-\", \".pdf\", context.cacheDir)\n                val pdf = repository.pdf(file, temporary!!) { received, size ->\n                    value = MaterialLoad(file = file, progress = if (size > 0) (received.toFloat() / size).coerceIn(0f, 1f) else null)\n                }\n                value = MaterialLoad(loading = false, file = file, pdf = pdf)\n            } else value = MaterialLoad(loading = false, file = file)\n        } catch (e: CancellationException) { temporary?.delete(); throw e }\n        catch (e: Exception) {\n            temporary?.delete()\n            value = MaterialLoad(loading = false, error = e.message ?: \"Não foi possível carregar o material.\")\n        }\n        awaitDispose { temporary?.delete() }\n    }\n    when {\n        loaded.loading -> Column(modifier, verticalArrangement = Arrangement.Center,\n            horizontalAlignment = Alignment.CenterHorizontally) {\n            CircularProgressIndicator()\n            Spacer(Modifier.height(16.dp))\n            Text(if (loaded.file?.contentType == ContentType.PDF) \"Preparando PDF…\" else \"Carregando material…\")\n            if (loaded.progress != null) {\n                Spacer(Modifier.height(16.dp))\n                LinearProgressIndicator(progress = { loaded.progress!! }, modifier = Modifier.widthIn(max = 360.dp).fillMaxWidth().padding(horizontal = 24.dp))\n                Text(\"${(loaded.progress!! * 100).toInt()}%\")\n            }\n        }\n        loaded.error != null -> ViewerMessage(\"Não foi possível carregar\", loaded.error!!,\n            onRetry = { retry++ }, onConfigure = onConfigure)\n        loaded.pdf != null -> NativePdf(loaded.pdf!!, modifier)\n        loaded.file != null -> NativeMedia(item.copy(type = loaded.file!!.contentType!!), loaded.file!!, repository, modifier, onConfigure)\n    }\n}\n\n@Composable private fun FolderContent(folder: DriveFile, item: StudyItem, repository: DriveRepository,\n    onFolder: (DriveFile) -> Unit, onFile: (DriveFile) -> Unit, onConfigure: () -> Unit) {\n    var query by remember(folder.id) { mutableStateOf(\"\") }\n    var retry by remember(folder.id) { mutableIntStateOf(0) }\n    val loaded by produceState(FolderLoad(), folder.id, repository, retry) {\n        value = FolderLoad()\n        try { value = FolderLoad(false, repository.folder(folder.id, folder.resourceKey)) }\n        catch (e: CancellationException) { throw e }\n        catch (e: Exception) { value = FolderLoad(false, error = e.message ?: \"Não foi possível ler a pasta.\") }\n    }\n    if (loaded.loading) Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) { CircularProgressIndicator() }\n    else if (loaded.error != null) ViewerMessage(\"Não foi possível abrir a pasta\", loaded.error!!,\n        onRetry = { retry++ }, onConfigure = onConfigure)\n    else Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n        Text(\"Localize: ${item.filename}\", style = MaterialTheme.typography.bodyMedium)\n        OutlinedTextField(query, onValueChange = { query = it }, modifier = Modifier.fillMaxWidth(),\n            singleLine = true, label = { Text(\"Buscar nesta pasta\") })\n        val files = loaded.files.filter { searchable(it.name).contains(searchable(query)) }\n        if (files.isEmpty()) Text(\"Nenhum arquivo encontrado nesta pasta.\")\n        LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n            items(files, key = { it.id }) { file ->\n                val supported = file.folder || file.contentType != null\n                Surface(shape = MaterialTheme.shapes.large, color = MaterialTheme.colorScheme.surfaceContainer,\n                    modifier = Modifier.fillMaxWidth().clickable(enabled = supported) {\n                        if (file.folder) onFolder(file) else onFile(file)\n                    }) {\n                    Row(Modifier.padding(16.dp), horizontalArrangement = Arrangement.spacedBy(12.dp),\n                        verticalAlignment = Alignment.CenterVertically) {\n                        Icon(when {\n                            file.folder -> Icons.Outlined.Folder\n                            file.contentType == ContentType.AUDIO -> Icons.Outlined.Headphones\n                            file.contentType == ContentType.PDF -> Icons.Outlined.Description\n                            else -> Icons.Outlined.PlayCircleOutline\n                        }, null, tint = MaterialTheme.colorScheme.primary)\n                        Column(Modifier.weight(1f)) {\n                            Text(file.name, maxLines = 2, overflow = TextOverflow.Ellipsis)\n                            Text(if (file.folder) \"Pasta\" else file.contentType?.label ?: \"Formato não suportado\",\n                                style = MaterialTheme.typography.bodySmall)\n                        }\n                    }\n                }\n            }\n        }\n    }\n}\n\n@Composable private fun ViewerMessage(title: String, detail: String, onRetry: (() -> Unit)? = null,\n    onConfigure: () -> Unit) {\n    Column(Modifier.fillMaxSize().padding(24.dp), verticalArrangement = Arrangement.Center,\n        horizontalAlignment = Alignment.CenterHorizontally) {\n        Icon(Icons.Outlined.CloudOff, null, Modifier.size(48.dp), tint = MaterialTheme.colorScheme.primary)\n        Spacer(Modifier.height(16.dp))\n        Text(title, style = MaterialTheme.typography.titleLarge)\n        Spacer(Modifier.height(8.dp)); Text(detail)\n        Spacer(Modifier.height(20.dp))\n        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n            if (onRetry != null) Button(onClick = onRetry) { Text(\"Tentar novamente\") }\n            OutlinedButton(onClick = onConfigure) { Text(\"Configurar Drive\") }\n        }\n    }\n}\n",
            "app/src/main/java/com/example/ui/DriveConfigDialog.kt": "package com.example.ui\n\nimport androidx.activity.compose.rememberLauncherForActivityResult\nimport androidx.activity.result.IntentSenderRequest\nimport androidx.activity.result.contract.ActivityResultContracts\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.text.selection.SelectionContainer\nimport androidx.compose.foundation.verticalScroll\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.text.input.PasswordVisualTransformation\nimport androidx.compose.ui.text.input.VisualTransformation\nimport com.google.android.gms.common.api.ApiException\nimport androidx.compose.ui.unit.dp\nimport com.example.data.drive.*\nimport com.google.android.gms.auth.api.identity.AuthorizationRequest\nimport com.google.android.gms.auth.api.identity.AuthorizationResult\nimport com.google.android.gms.auth.api.identity.Identity\nimport com.google.android.gms.common.api.Scope\n\nprivate fun authorizationFailure(error: Throwable): String {\n    val code = (error as? ApiException)?.statusCode\n    return when (code) {\n        8 -> \"O Google retornou erro interno (código 8). Tente novamente com conexão ativa. Esse código sozinho não identifica falha de cadastro OAuth.\"\n        10 -> \"Google recusou o cadastro do app (código 10). No Google Cloud, cadastre um cliente OAuth Android com o pacote e SHA-1 exibidos abaixo. Uma chave de API sozinha não permite conectar a conta.\"\n        7 -> \"Sem conexão com o Google (código 7). Confira a internet e tente novamente.\"\n        16 -> \"O Google devolveu cancelamento (código 16). Se você confirmou a conta, confira o cliente OAuth Android e os usuários de teste da tela de consentimento.\"\n        else -> \"Não foi possível autorizar a conta. Código Google: ${code ?: \"indisponível\"}. Confira o cliente OAuth Android, o SHA-1 e a tela de consentimento no Google Cloud.\"\n    }\n}\n\n@Composable fun DriveConfigDialog(onDismiss: () -> Unit) {\n    val context = LocalContext.current\n    val settings = remember { DriveSettings(context) }\n    var key by remember { mutableStateOf(settings.apiKey()) }\n    var message by remember { mutableStateOf<String?>(null) }\n    var busy by remember { mutableStateOf(false) }\n    var showKey by remember { mutableStateOf(false) }\n    fun authorized(result: AuthorizationResult) {\n        busy = false\n        val token = result.accessToken.orEmpty()\n        if (token.isBlank()) message = \"A leitura dos arquivos não foi autorizada.\"\n        else { DriveSession.accessToken = token; DriveSession.revision++; onDismiss() }\n    }\n    val launcher = rememberLauncherForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { result ->\n        runCatching { Identity.getAuthorizationClient(context).getAuthorizationResultFromIntent(result.data) }\n            .onSuccess(::authorized).onFailure { busy = false; message = authorizationFailure(it) }\n    }\n    val fingerprint = remember { installedCertificate(context).chunked(2).joinToString(\":\") }\n    AlertDialog(onDismissRequest = onDismiss,\n        title = { Text(\"Conectar ao Google Drive\") },\n        text = {\n            Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                Text(\"Cole sua chave para abrir arquivos públicos diretamente no Kepleræ.\")\n                OutlinedTextField(value = key, onValueChange = { key = it; message = null },\n                    label = { Text(\"Chave de API do Drive\") }, singleLine = true,\n                    visualTransformation = if (showKey) VisualTransformation.None else PasswordVisualTransformation(),\n                    trailingIcon = { TextButton(onClick = { showKey = !showKey }) { Text(if (showKey) \"Ocultar\" else \"Mostrar\") } },\n                    modifier = Modifier.fillMaxWidth())\n                Text(\"A chave fica protegida neste dispositivo e não é incluída no projeto do GitHub.\",\n                    style = MaterialTheme.typography.bodySmall)\n                HorizontalDivider()\n                Text(\"Arquivos privados\", style = MaterialTheme.typography.titleSmall)\n                Text(\"Autorize a leitura pela conta Google que tem acesso aos materiais. Isso não permite alterar nem excluir seus arquivos.\")\n                OutlinedButton(enabled = !busy, onClick = {\n                    busy = true; message = null\n                    val request = AuthorizationRequest.builder()\n                        .setRequestedScopes(listOf(Scope(\"https://www.googleapis.com/auth/drive.readonly\"))).build()\n                    Identity.getAuthorizationClient(context).authorize(request)\n                        .addOnSuccessListener { result ->\n                            if (result.hasResolution()) {\n                                val pending = result.pendingIntent\n                                if (pending == null) { busy = false; message = \"Não foi possível iniciar a autorização.\" }\n                                else runCatching { launcher.launch(IntentSenderRequest.Builder(pending.intentSender).build()) }\n                                    .onFailure { busy = false; message = authorizationFailure(it) }\n                            } else authorized(result)\n                        }\n                        .addOnFailureListener {\n                            busy = false\n                            message = authorizationFailure(it)\n                        }\n                }, modifier = Modifier.fillMaxWidth()) { Text(if (busy) \"Aguardando Google…\" else \"Autorizar conta Google\") }\n                if (DriveSession.accessToken.isNotBlank()) TextButton(onClick = { DriveSession.clear(); message = \"Conta desconectada deste app.\" }) {\n                    Text(\"Desconectar conta\")\n                }\n                if (message != null) Text(message!!, color = MaterialTheme.colorScheme.error)\n                Text(\"Cadastro da chave / OAuth\", style = MaterialTheme.typography.titleSmall)\n                SelectionContainer { Column {\n                    Text(\"Pacote: ${context.packageName}\", style = MaterialTheme.typography.bodySmall)\n                    Text(\"SHA-1: $fingerprint\", style = MaterialTheme.typography.bodySmall)\n                } }\n                Text(\"Se sua chave tem restrição Android, use esses dados. A autorização de arquivos privados também exige um cliente OAuth Android com esse pacote e SHA-1.\",\n                    style = MaterialTheme.typography.bodySmall)\n            }\n        },\n        confirmButton = { TextButton(onClick = {\n            val cleaned = key.filterNot { it.isWhitespace() || Character.getType(it) == Character.FORMAT.toInt() }\n                .trim('\"', '\\'')\n            if (cleaned.isNotEmpty() && (cleaned.length < 20 || cleaned.any { !it.isLetterOrDigit() && it != '_' && it != '-' })) {\n                message = \"Cole apenas o valor da chave, sem endereço, JSON ou texto adicional. Use Mostrar para conferir.\"\n            } else runCatching { settings.saveApiKey(cleaned) }\n                .onSuccess { onDismiss() }.onFailure { message = \"Não foi possível salvar a chave neste aparelho.\" }\n        }) { Text(\"Salvar chave\") } },\n        dismissButton = { TextButton(onClick = onDismiss) { Text(\"Fechar\") } })\n}\n",
            "app/src/main/java/com/example/ui/NativeMedia.kt": "package com.example.ui\n\nimport android.view.ViewGroup\nimport androidx.compose.foundation.background\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material.icons.Icons\nimport androidx.compose.material.icons.outlined.Headphones\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.draw.clip\nimport androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.unit.dp\nimport androidx.compose.ui.viewinterop.AndroidView\nimport androidx.lifecycle.Lifecycle\nimport androidx.lifecycle.LifecycleEventObserver\nimport androidx.lifecycle.compose.LocalLifecycleOwner\nimport androidx.media3.common.*\nimport androidx.media3.datasource.DefaultHttpDataSource\nimport androidx.media3.datasource.HttpDataSource\nimport androidx.media3.exoplayer.ExoPlayer\nimport androidx.media3.exoplayer.source.DefaultMediaSourceFactory\nimport androidx.media3.ui.PlayerView\nimport com.example.data.drive.*\nimport com.example.data.model.ContentType\nimport com.example.data.model.StudyItem\nimport kotlinx.coroutines.delay\n\n@androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)\n@Composable fun NativeMedia(item: StudyItem, file: DriveFile, repository: DriveRepository,\n    modifier: Modifier = Modifier, onConfigure: () -> Unit) {\n    val context = LocalContext.current\n    val lifecycle = LocalLifecycleOwner.current.lifecycle\n    val preferences = remember { context.getSharedPreferences(\"keplerae_playback\", 0) }\n    var failure by remember(file.id, repository) { mutableStateOf<String?>(null) }\n    var buffering by remember(file.id, repository) { mutableStateOf(true) }\n    var speed by remember(file.id) { mutableFloatStateOf(1f) }\n    val player = remember(file.id, repository) {\n        val dataSource = DefaultHttpDataSource.Factory()\n            .setConnectTimeoutMs(15000).setReadTimeoutMs(30000)\n            .setDefaultRequestProperties(repository.headers(file.id, file.resourceKey))\n        ExoPlayer.Builder(context)\n            .setMediaSourceFactory(DefaultMediaSourceFactory(dataSource))\n            .setSeekBackIncrementMs(10000).setSeekForwardIncrementMs(10000).build().apply {\n                setAudioAttributes(AudioAttributes.DEFAULT, true)\n                setHandleAudioBecomingNoisy(true)\n                setMediaItem(MediaItem.Builder().setUri(DriveRequests.file(file.id, true))\n                    .setMimeType(file.mimeType)\n                    .setMediaMetadata(MediaMetadata.Builder().setTitle(item.title).build()).build())\n                seekTo(preferences.getLong(file.id, 0).coerceAtLeast(0))\n                playWhenReady = false\n            }\n    }\n    DisposableEffect(player, lifecycle) {\n        val listener = object : Player.Listener {\n            override fun onPlaybackStateChanged(state: Int) { buffering = state == Player.STATE_BUFFERING }\n            override fun onPlayerError(error: PlaybackException) {\n                buffering = false\n                val http = generateSequence<Throwable>(error) { it.cause }\n                    .filterIsInstance<HttpDataSource.InvalidResponseCodeException>().firstOrNull()\n                failure = if (http != null) DriveRequests.errorMessage(http.responseCode,\n                    DriveRequests.errorReason(String(http.responseBody, Charsets.UTF_8)))\n                else when (error.errorCode) {\n                    PlaybackException.ERROR_CODE_DECODING_FAILED, PlaybackException.ERROR_CODE_DECODING_FORMAT_UNSUPPORTED ->\n                        \"Este aparelho não conseguiu decodificar o formato do arquivo.\"\n                    else -> \"Não foi possível reproduzir. Confira a conexão e as permissões no Drive.\"\n                }\n            }\n        }\n        val observer = LifecycleEventObserver { _, event ->\n            if (event == Lifecycle.Event.ON_STOP) {\n                player.pause()\n                preferences.edit().putLong(file.id, if (player.playbackState == Player.STATE_ENDED) 0 else player.currentPosition).apply()\n            }\n        }\n        player.addListener(listener); lifecycle.addObserver(observer); player.prepare()\n        onDispose {\n            preferences.edit().putLong(file.id, if (player.playbackState == Player.STATE_ENDED) 0 else player.currentPosition).apply()\n            lifecycle.removeObserver(observer); player.removeListener(listener); player.release()\n        }\n    }\n    LaunchedEffect(player) {\n        while (true) { delay(5000)\n            if (player.isPlaying) preferences.edit().putLong(file.id, player.currentPosition).apply()\n        }\n    }\n    BoxWithConstraints(modifier) {\n    val showArtwork = maxHeight >= 400.dp\n    Column(Modifier.fillMaxSize(), horizontalAlignment = Alignment.CenterHorizontally,\n        verticalArrangement = Arrangement.Center) {\n        if (item.type == ContentType.AUDIO && showArtwork) {\n            Surface(shape = MaterialTheme.shapes.extraLarge, color = MaterialTheme.colorScheme.primaryContainer,\n                modifier = Modifier.padding(24.dp)) {\n                Icon(Icons.Outlined.Headphones, null, Modifier.padding(36.dp).size(64.dp),\n                    tint = MaterialTheme.colorScheme.onPrimaryContainer)\n            }\n            Text(item.title, style = MaterialTheme.typography.titleLarge, modifier = Modifier.padding(horizontal = 24.dp))\n        }\n        Box(Modifier.fillMaxWidth().weight(1f, fill = false)\n            .heightIn(min = if (item.type == ContentType.AUDIO) 140.dp else 160.dp)\n            .clip(MaterialTheme.shapes.large).background(Color.Black), contentAlignment = Alignment.Center) {\n            AndroidView(factory = { ctx -> PlayerView(ctx).also { it.player = player }.apply {\n                layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)\n                setEnableComposeSurfaceSyncWorkaround(true)\n                setShowBuffering(PlayerView.SHOW_BUFFERING_ALWAYS)\n                setShowNextButton(false); setShowPreviousButton(false)\n                setShowFastForwardButton(true); setShowRewindButton(true)\n                controllerShowTimeoutMs = if (item.type == ContentType.AUDIO) 0 else 5000\n                controllerAutoShow = true\n                showController()\n            } }, update = { it.player = player }, modifier = Modifier.fillMaxSize())\n            if (buffering) CircularProgressIndicator(Modifier.size(36.dp), color = Color.White)\n        }\n        Row(Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.Center) {\n            listOf(.75f, 1f, 1.25f, 1.5f, 2f).forEach { rate ->\n                FilterChip(selected = speed == rate, onClick = { speed = rate; player.setPlaybackSpeed(rate) },\n                    label = { Text(\"${rate}×\") }, modifier = Modifier.padding(horizontal = 3.dp))\n            }\n        }\n        if (failure != null) {\n            Text(failure!!, color = MaterialTheme.colorScheme.error, modifier = Modifier.padding(16.dp))\n            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                Button(onClick = { failure = null; buffering = true; player.prepare() }) { Text(\"Tentar novamente\") }\n                OutlinedButton(onClick = onConfigure) { Text(\"Configurar Drive\") }\n            }\n        }\n    }\n    }\n}\n",
            "app/src/main/java/com/example/ui/NativePdf.kt": "package com.example.ui\n\nimport android.graphics.Bitmap\nimport android.graphics.pdf.PdfRenderer\nimport android.os.ParcelFileDescriptor\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.gestures.detectTransformGestures\nimport androidx.compose.foundation.layout.*\nimport androidx.compose.material3.*\nimport androidx.compose.runtime.*\nimport androidx.compose.runtime.saveable.rememberSaveable\nimport androidx.compose.ui.Alignment\nimport androidx.compose.ui.Modifier\nimport androidx.compose.ui.graphics.asImageBitmap\nimport androidx.compose.ui.graphics.graphicsLayer\nimport androidx.compose.ui.input.pointer.pointerInput\nimport androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.unit.dp\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext\nimport java.io.File\n\nprivate data class PdfPage(val bitmap: Bitmap? = null, val count: Int = 0, val error: String? = null)\n@Composable fun NativePdf(file: File, modifier: Modifier = Modifier) {\n    var pageIndex by rememberSaveable(file.path) { mutableIntStateOf(0) }\n    var zoom by remember(file.path, pageIndex) { mutableFloatStateOf(1f) }\n    var offsetX by remember(file.path, pageIndex) { mutableFloatStateOf(0f) }\n    var offsetY by remember(file.path, pageIndex) { mutableFloatStateOf(0f) }\n    val page by produceState(PdfPage(), file.path, pageIndex) {\n        value = PdfPage()\n        value = withContext(Dispatchers.IO) {\n            try {\n                ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY).use { descriptor ->\n                    PdfRenderer(descriptor).use { renderer ->\n                        renderer.openPage(pageIndex.coerceIn(0, renderer.pageCount - 1)).use { opened ->\n                            val scale = minOf(2048f / opened.width, 2560f / opened.height)\n                            val bitmap = Bitmap.createBitmap((opened.width * scale).toInt().coerceAtLeast(1),\n                                (opened.height * scale).toInt().coerceAtLeast(1), Bitmap.Config.ARGB_8888)\n                            bitmap.eraseColor(android.graphics.Color.WHITE)\n                            opened.render(bitmap, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)\n                            PdfPage(bitmap, renderer.pageCount)\n                        }\n                    }\n                }\n            } catch (e: Exception) { PdfPage(error = \"Não foi possível ler este PDF. Ele pode estar danificado ou protegido por senha.\") }\n        }\n    }\n    // Only the current page is held by Compose; renderer and descriptor close after each render.\n    Column(modifier) {\n        Row(Modifier.fillMaxWidth().padding(8.dp), horizontalArrangement = Arrangement.SpaceBetween,\n            verticalAlignment = Alignment.CenterVertically) {\n            OutlinedButton(enabled = pageIndex > 0, onClick = { pageIndex-- }) { Text(\"Anterior\") }\n            Text(if (page.count > 0) \"${pageIndex + 1} / ${page.count}\" else \"Carregando…\")\n            OutlinedButton(enabled = pageIndex + 1 < page.count, onClick = { pageIndex++ }) { Text(\"Próxima\") }\n        }\n        Box(Modifier.weight(1f).fillMaxWidth(), contentAlignment = Alignment.Center) {\n            if (page.bitmap != null) {\n                Image(page.bitmap!!.asImageBitmap(), \"Página ${pageIndex + 1}\",\n                    contentScale = ContentScale.Fit,\n                    modifier = Modifier.fillMaxSize().pointerInput(pageIndex) {\n                        detectTransformGestures { _, pan, scale, _ ->\n                            zoom = (zoom * scale).coerceIn(1f, 4f)\n                            offsetX = if (zoom == 1f) 0f else (offsetX + pan.x).coerceIn(-size.width * (zoom - 1) / 2, size.width * (zoom - 1) / 2)\n                            offsetY = if (zoom == 1f) 0f else (offsetY + pan.y).coerceIn(-size.height * (zoom - 1) / 2, size.height * (zoom - 1) / 2)\n                        }\n                    }.graphicsLayer(scaleX = zoom, scaleY = zoom, translationX = offsetX, translationY = offsetY))\n            } else if (page.error != null) Text(page.error!!, modifier = Modifier.padding(24.dp))\n            else CircularProgressIndicator()\n        }\n        TextButton(onClick = { zoom = 1f; offsetX = 0f; offsetY = 0f }, modifier = Modifier.align(Alignment.CenterHorizontally)) {\n            Text(\"Ajustar página · use dois dedos para ampliar\")\n        }\n    }\n}\n",
            "app/src/main/java/com/example/data/drive/DriveRequests.kt": "package com.example.data.drive\n\nimport java.net.URI\nimport java.net.URLDecoder\nimport java.net.URLEncoder\n\ndata class DriveCredentials(val apiKey: String = \"\", val accessToken: String = \"\") {\n    val configured: Boolean get() = apiKey.isNotBlank() || accessToken.isNotBlank()\n    fun headers(packageName: String, certificate: String, id: String, resourceKey: String): Map<String, String> = buildMap {\n        if (accessToken.isNotBlank()) put(\"Authorization\", \"Bearer $accessToken\")\n        else if (apiKey.isNotBlank()) put(\"X-Goog-Api-Key\", apiKey)\n        put(\"X-Android-Package\", packageName)\n        if (certificate.isNotBlank()) put(\"X-Android-Cert\", certificate)\n        if (resourceKey.isNotBlank()) put(\"X-Goog-Drive-Resource-Keys\", \"$id/$resourceKey\")\n    }\n}\n\nobject DriveRequests {\n    private fun encode(value: String) = URLEncoder.encode(value, \"UTF-8\")\n    fun file(id: String, media: Boolean = false): String {\n        require(id.matches(Regex(\"[A-Za-z0-9_-]+\"))) { \"Identificador do arquivo inválido.\" }\n        val fields = \"id,name,mimeType,size,resourceKey,capabilities(canDownload),shortcutDetails(targetId,targetMimeType,targetResourceKey)\"\n        return \"https://www.googleapis.com/drive/v3/files/$id?\" +\n            if (media) \"alt=media&supportsAllDrives=true\" else \"supportsAllDrives=true&fields=${encode(fields)}\"\n    }\n    fun folder(id: String, pageToken: String = \"\"): String {\n        require(id.matches(Regex(\"[A-Za-z0-9_-]+\")))\n        val query = \"'$id' in parents and trashed = false\"\n        val fields = \"nextPageToken,files(id,name,mimeType,size,resourceKey,capabilities(canDownload),shortcutDetails(targetId,targetMimeType,targetResourceKey))\"\n        return \"https://www.googleapis.com/drive/v3/files?q=${encode(query)}&pageSize=100\" +\n            \"&supportsAllDrives=true&includeItemsFromAllDrives=true&fields=${encode(fields)}\" +\n            if (pageToken.isBlank()) \"\" else \"&pageToken=${encode(pageToken)}\"\n    }\n    fun resourceKey(url: String): String = runCatching {\n        URI(url).rawQuery.orEmpty().split('&').firstNotNullOfOrNull { part ->\n            val pair = part.split('=', limit = 2)\n            if (pair.size == 2 && pair[0].equals(\"resourcekey\", true)) URLDecoder.decode(pair[1], \"UTF-8\") else null\n        }.orEmpty()\n    }.getOrDefault(\"\")\n    fun folderId(url: String): String = runCatching {\n        URI(url).path.substringAfter(\"/drive/folders/\").substringBefore('/')\n            .takeIf { it.matches(Regex(\"[A-Za-z0-9_-]+\")) }.orEmpty()\n    }.getOrDefault(\"\")\n    fun errorMessage(status: Int, reason: String): String = when {\n        status == 401 -> \"A autorização Google expirou. Autorize sua conta novamente.\"\n        reason in setOf(\"keyInvalid\", \"API_KEY_INVALID\", \"badRequest\") -> \"Confira a chave de API nas configurações do Drive.\"\n        reason in setOf(\"accessNotConfigured\", \"SERVICE_DISABLED\") -> \"Ative a Google Drive API no projeto da sua chave.\"\n        reason in setOf(\"downloadQuotaExceeded\", \"rateLimitExceeded\", \"userRateLimitExceeded\", \"quotaExceeded\") || status == 429 ->\n            \"O Drive atingiu um limite de acesso. Aguarde e tente novamente.\"\n        reason in setOf(\"cannotDownloadFile\", \"fileNotDownloadable\", \"downloadRestrictedForRevision\") ->\n            \"O proprietário bloqueou o acesso ao conteúdo pela API.\"\n        status == 404 -> \"Arquivo não encontrado ou sem acesso. Para arquivos privados, autorize a conta Google correta.\"\n        status == 403 -> \"Acesso negado. Confira as restrições da chave ou autorize a conta Google que pode acessar o arquivo.\"\n        status >= 500 -> \"O Drive está temporariamente indisponível. Tente novamente.\"\n        else -> \"Não foi possível carregar este material. Confira a conexão e tente novamente.\"\n    }\n    fun errorReason(body: String): String = Regex(\"\\\"reason\\\"\\\\s*:\\\\s*\\\"([^\\\"]+)\\\"\")\n        .find(body)?.groupValues?.get(1).orEmpty()\n}\n",
            "app/src/main/java/com/example/data/drive/DriveSettings.kt": "package com.example.data.drive\n\nimport android.content.Context\nimport android.content.pm.PackageManager\nimport android.os.Build\nimport android.security.keystore.KeyGenParameterSpec\nimport android.security.keystore.KeyProperties\nimport android.util.Base64\nimport androidx.compose.runtime.getValue\nimport androidx.compose.runtime.mutableStateOf\nimport androidx.compose.runtime.setValue\nimport java.security.KeyStore\nimport java.security.MessageDigest\nimport javax.crypto.Cipher\nimport javax.crypto.KeyGenerator\nimport javax.crypto.SecretKey\nimport javax.crypto.spec.GCMParameterSpec\n\nobject DriveSession {\n    // Short-lived Google access tokens stay in memory; no refresh token or client secret is stored.\n    var accessToken by mutableStateOf(\"\")\n    var revision by mutableStateOf(0)\n    fun clear() { accessToken = \"\"; revision++ }\n}\n\nclass DriveSettings(private val context: Context, preferenceName: String = \"keplerae_drive\") {\n    private val prefs = context.getSharedPreferences(preferenceName, Context.MODE_PRIVATE)\n    private fun secret(): SecretKey {\n        val store = KeyStore.getInstance(\"AndroidKeyStore\").apply { load(null) }\n        (store.getKey(\"keplerae_drive_key\", null) as? SecretKey)?.let { return it }\n        return KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, \"AndroidKeyStore\").apply {\n            init(KeyGenParameterSpec.Builder(\"keplerae_drive_key\", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)\n                .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).build())\n        }.generateKey()\n    }\n    fun apiKey(): String = runCatching {\n        val encrypted = prefs.getString(\"api_key\", null) ?: return@runCatching \"\"\n        val parts = encrypted.split(':', limit = 2)\n        val cipher = Cipher.getInstance(\"AES/GCM/NoPadding\")\n        cipher.init(Cipher.DECRYPT_MODE, secret(), GCMParameterSpec(128, Base64.decode(parts[0], Base64.NO_WRAP)))\n        String(cipher.doFinal(Base64.decode(parts[1], Base64.NO_WRAP)), Charsets.UTF_8)\n    }.getOrDefault(\"\")\n    fun saveApiKey(value: String) {\n        if (value.isBlank()) prefs.edit().remove(\"api_key\").apply()\n        else {\n            val cipher = Cipher.getInstance(\"AES/GCM/NoPadding\")\n            cipher.init(Cipher.ENCRYPT_MODE, secret())\n            val encrypted = Base64.encodeToString(cipher.iv, Base64.NO_WRAP) + \":\" +\n                Base64.encodeToString(cipher.doFinal(value.trim().toByteArray(Charsets.UTF_8)), Base64.NO_WRAP)\n            prefs.edit().putString(\"api_key\", encrypted).apply()\n        }\n        DriveSession.revision++\n    }\n    fun credentials() = DriveCredentials(apiKey(), DriveSession.accessToken)\n}\n\n@Suppress(\"DEPRECATION\")\nfun installedCertificate(context: Context): String = runCatching {\n    val signatures = if (Build.VERSION.SDK_INT >= 28) {\n        val info = context.packageManager.getPackageInfo(context.packageName, PackageManager.GET_SIGNING_CERTIFICATES)\n        info.signingInfo?.apkContentsSigners\n    } else context.packageManager.getPackageInfo(context.packageName, PackageManager.GET_SIGNATURES).signatures\n    val certificate = signatures?.firstOrNull()?.toByteArray() ?: return@runCatching \"\"\n    MessageDigest.getInstance(\"SHA-1\").digest(certificate).joinToString(\"\") { \"%02X\".format(it) }\n}.getOrDefault(\"\")\n",
            "app/src/main/java/com/example/data/drive/DriveRepository.kt": "package com.example.data.drive\n\nimport android.content.Context\nimport com.example.data.model.*\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.currentCoroutineContext\nimport kotlinx.coroutines.ensureActive\nimport kotlinx.coroutines.withContext\nimport org.json.JSONObject\nimport java.io.File\nimport java.io.IOException\nimport java.net.HttpURLConnection\nimport java.net.URL\n\ndata class DriveFile(val id: String, val name: String, val mimeType: String, val resourceKey: String = \"\",\n    val canDownload: Boolean = true, val size: Long = 0) {\n    val folder: Boolean get() = mimeType == \"application/vnd.google-apps.folder\"\n    val contentType: ContentType? get() = when {\n        mimeType == \"application/pdf\" || name.endsWith(\".pdf\", true) -> ContentType.PDF\n        mimeType.startsWith(\"video/\") -> ContentType.VIDEO\n        mimeType.startsWith(\"audio/\") -> ContentType.AUDIO\n        else -> null\n    }\n    fun studyItem(parent: StudyItem): StudyItem = parent.copy(\n        id = if (name.equals(parent.filename, true)) parent.id else \"drive-$id\",\n        title = name.substringBeforeLast('.'), filename = name,\n        type = contentType ?: parent.type, linkKind = LinkKind.FILE, driveFileId = id,\n        url = \"https://drive.google.com/file/d/$id/view\" + if (resourceKey.isBlank()) \"\" else \"?resourcekey=$resourceKey\",\n        note = \"\")\n}\n\nclass DriveRepository(private val context: Context, val credentials: DriveCredentials) {\n    private val certificate = installedCertificate(context)\n    fun headers(id: String, resourceKey: String) = credentials.headers(context.packageName, certificate, id, resourceKey)\n    private fun connection(url: String, id: String, resourceKey: String): HttpURLConnection {\n        check(credentials.configured) { \"Configure sua chave de API ou autorize uma conta Google.\" }\n        return (URL(url).openConnection() as HttpURLConnection).apply {\n            connectTimeout = 15000; readTimeout = 30000\n            headers(id, resourceKey).forEach { (key, value) -> setRequestProperty(key, value) }\n        }\n    }\n    private fun checkResponse(connection: HttpURLConnection) {\n        if (connection.responseCode in 200..299) return\n        val body = connection.errorStream?.bufferedReader()?.use { it.readText().take(65536) }.orEmpty()\n        val reason = runCatching {\n            val error = JSONObject(body).getJSONObject(\"error\")\n            error.optJSONArray(\"errors\")?.optJSONObject(0)?.optString(\"reason\").orEmpty().ifBlank {\n                error.optJSONArray(\"details\")?.optJSONObject(0)?.optString(\"reason\").orEmpty()\n            }\n        }.getOrDefault(\"\")\n        throw IOException(DriveRequests.errorMessage(connection.responseCode, reason))\n    }\n    private suspend fun json(url: String, id: String, resourceKey: String): JSONObject = withContext(Dispatchers.IO) {\n        val request = connection(url, id, resourceKey)\n        try { checkResponse(request); currentCoroutineContext().ensureActive()\n            JSONObject(request.inputStream.bufferedReader().use { it.readText() })\n        } finally { request.disconnect() }\n    }\n    private fun parse(row: JSONObject): DriveFile {\n        val shortcut = row.optJSONObject(\"shortcutDetails\")\n        return DriveFile(shortcut?.optString(\"targetId\")?.takeIf { it.isNotBlank() } ?: row.getString(\"id\"),\n            row.getString(\"name\"), shortcut?.optString(\"targetMimeType\")?.takeIf { it.isNotBlank() } ?: row.getString(\"mimeType\"),\n            shortcut?.optString(\"targetResourceKey\")?.takeIf { it.isNotBlank() } ?: row.optString(\"resourceKey\"),\n            row.optJSONObject(\"capabilities\")?.optBoolean(\"canDownload\", true) ?: true, row.optString(\"size\").toLongOrNull() ?: 0)\n    }\n    suspend fun metadata(id: String, resourceKey: String): DriveFile {\n        var file = parse(json(DriveRequests.file(id), id, resourceKey))\n        if (file.id != id) return parse(json(DriveRequests.file(file.id), file.id, file.resourceKey))\n        return file.copy(resourceKey = file.resourceKey.ifBlank { resourceKey })\n    }\n    suspend fun folder(id: String, resourceKey: String): List<DriveFile> {\n        val files = mutableListOf<DriveFile>(); var token = \"\"\n        do {\n            currentCoroutineContext().ensureActive()\n            val page = json(DriveRequests.folder(id, token), id, resourceKey)\n            val rows = page.optJSONArray(\"files\")\n            if (rows != null) for (i in 0 until rows.length()) files += parse(rows.getJSONObject(i))\n            token = page.optString(\"nextPageToken\")\n        } while (token.isNotBlank())\n        return files.distinctBy { it.id }.sortedWith(compareBy<DriveFile> { !it.folder }.thenBy { searchable(it.name) })\n    }\n    suspend fun pdf(file: DriveFile, destination: File, onProgress: (Long, Long) -> Unit): File = withContext(Dispatchers.IO) {\n        require(file.canDownload) { \"O proprietário bloqueou o acesso ao conteúdo pela API.\" }\n        val request = connection(DriveRequests.file(file.id, true), file.id, file.resourceKey)\n        try {\n            checkResponse(request)\n            val size = request.contentLengthLong; var received = 0L; var lastUpdate = 0L\n            request.inputStream.use { input -> destination.outputStream().use { output ->\n                val buffer = ByteArray(32768)\n                while (true) {\n                    currentCoroutineContext().ensureActive()\n                    val count = input.read(buffer); if (count < 0) break\n                    output.write(buffer, 0, count); received += count\n                    if (received - lastUpdate >= 262144) { onProgress(received, size); lastUpdate = received }\n                }\n            } }\n            currentCoroutineContext().ensureActive()\n            require(destination.inputStream().use { String(it.readNBytesCompat(5), Charsets.US_ASCII) } == \"%PDF-\") {\n                \"O Drive não retornou um PDF válido.\" }\n            onProgress(received, size); destination\n        } catch (e: Exception) { destination.delete(); throw e }\n        finally { request.disconnect() }\n    }\n}\nprivate fun java.io.InputStream.readNBytesCompat(length: Int): ByteArray {\n    val result = ByteArray(length); var offset = 0\n    while (offset < length) { val n = read(result, offset, length - offset); if (n < 0) break; offset += n }\n    return result.copyOf(offset)\n}\n",
            "app/src/main/res/values/themes.xml": "<resources>\n    <style name=\"Theme.MyApplication\" parent=\"Theme.AppCompat.Light.NoActionBar\">\n        <item name=\"android:windowLightStatusBar\">true</item>\n        <item name=\"android:windowActionModeOverlay\">true</item>\n        <item name=\"android:fontFamily\">sans</item>\n        <item name=\"android:windowBackground\">#FCF8FF</item>\n    </style>\n</resources>\n",
